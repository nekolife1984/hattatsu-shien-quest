          "</div>";
        if (backupUi.pending) {
          h += '<div class="reset-confirm"><p>現在の記録（回答 ' + state.totalAnswered + "問・" + state.xp + " XP）を、読み込んだ記録（回答 " + backupUi.pending.totalAnswered + "問・" + backupUi.pending.xp + " XP）で置き換えますか？今の記録は元に戻せません。</p>" +
            '<div class="btn-row"><button type="button" class="btn-danger font-round" data-action="import-confirm">置き換えて読み込む</button>' +
            '<button type="button" class="btn-ghost font-round" data-action="import-cancel">キャンセル</button></div></div>';
        }
        if (!resetConfirming) {
          h += '<button type="button" class="reset-btn font-round" data-action="reset-ask">' + icon("trash", 18) + "学習データをリセット</button>";
        } else {
          h += '<div class="reset-confirm"><p>XP・レベル・バッジ・間違えた問題の記録など、すべての学習データを消去します。元に戻せません。本当にリセットしますか？</p>' +
            '<div class="btn-row"><button type="button" class="btn-danger font-round" data-action="reset-do">リセットする</button>' +
            '<button type="button" class="btn-ghost font-round" data-action="reset-cancel">キャンセル</button></div></div>';
        }
        h += "</section></div>";
        return h;
      }

      function quizHtml() {
        var q = session.questions[quiz.index];
        var total = session.questions.length;
        var answered = quiz.picked !== null;
        var correctCount = quiz.results.filter(function (r) { return r.correct; }).length;
        var rate = quiz.results.length > 0 ? Math.round(correctCount / quiz.results.length * 100) : null;
        var progressPct = Math.round((quiz.index + (answered ? 1 : 0)) / total * 100);
        var st = state.stats[q.id];
        var graduating = session.mode === "review" && quiz.picked === null && st && st.onWrongList;
        // Note: graduating badge shown pre-answer based on list membership at question start.
        var h = '<div class="animate-rise">';
        h += '<div class="quiz-head"><p class="quiz-title font-round">' + esc(session.title) + '</p>' +
          '<button type="button" class="quit-btn" data-action="quit">' + (quiz.results.length > 0 ? "終了して結果を見る" : "やめる") + "</button></div>";
        h += '<div class="quiz-progress"><span class="cnt font-round">' + (quiz.index + 1) + " / " + total + '問</span>' +
          '<div class="bar-track track" role="progressbar" aria-valuenow="' + (quiz.index + (answered ? 1 : 0)) + '" aria-valuemin="0" aria-valuemax="' + total + '" aria-label="進捗"><div class="bar-fill" style="width:' + progressPct + '%"></div></div>' +
          '<span class="rate">正解率 ' + (rate === null ? "—" : rate + "%") + "</span></div>";
        if (quiz.streak >= 2) {
          h += '<p class="streak-pill">' + icon("flame", 16) + quiz.streak + "連続正解中！" +
            (quiz.streak === 4 ? " あと1問でコンボボーナス" : "") +
            (quiz.streak === 9 ? " あと1問で大きなコンボボーナス" : "") + "</p>";
        }
        h += '<section class="card q-card"><div class="q-meta">' +
          '<span class="q-cat" style="background:' + catColor(q.category) + '">' + esc(q.category) + "</span>" +
          '<span class="q-num">問題 ' + q.id + "</span>" +
          (graduating ? '<span class="q-grad">復習中：正解で卒業！</span>' : "") +
          "</div>" +
          '<h2 class="q-text">' + esc(q.question) + "</h2>" +
          '<div class="choices">' + q.choices.map(function (choice, i) {
            var cls = "choice";
            var mark = String(i + 1);
            if (answered) {
              if (i === q.answer) { cls += " is-answer"; mark = icon("check", 16); }
              else if (i === quiz.picked) { cls += " is-picked-wrong"; mark = icon("x", 16); }
              else cls += " is-dim";
            }
            return '<button type="button" class="' + cls + '" data-action="pick" data-arg="' + i + '"' + (answered ? " disabled" : "") + ' aria-label="選択肢' + (i + 1) + "：" + esc(choice) + '"><span class="mark font-round">' + mark + '</span><span style="flex:1">' + esc(choice) + "</span></button>";
          }).join("") + "</div>";
        if (answered) {
          var isCorrect = quiz.picked === q.answer;
          var lastResult = quiz.results[quiz.results.length - 1];
          var xp = lastResult ? lastResult.xp : 0;
          var wasGraduating = lastResult ? lastResult.graduating : false;
          h += '<div class="feedback animate-rise">' + (isCorrect && quiz.burst > 0 ? confettiBurstHtml() : "") +
            '<div class="feedback-box ' + (isCorrect ? "ok" : "ng") + '" role="status">' +
            '<p class="feedback-title font-round ' + (isCorrect ? "ok" : "ng") + '">' +
            (isCorrect
              ? icon("check", 22) + "正解！<span class=\"xp-pill\">+" + xp + " XP</span>" + (wasGraduating ? '<span class="grad-pill">卒業！</span>' : "")
              : icon("x", 22) + "残念… 正解は「" + esc(q.choices[q.answer]) + "」") +
            "</p>" +
            (!isCorrect ? '<p class="feedback-note">この問題は「間違えた問題」に記録されました。復習モードでやり直せます。</p>' : "") +
            (saveStatus === "failed"
              ? '<p class="feedback-note" style="color:var(--bad);font-weight:700">記録を保存できませんでした（ブラウザ保存・Cookieの両方）。このまま閉じると進捗が消えてしまいます。終わったらホームの「設定」から記録を書き出してください。</p>'
              : '<p class="feedback-note">' + icon("check", 13) + " 記録を保存しました（" + saveWhereLabel() + "）</p>") +
            '<div class="expl-block"><p class="expl-label">' + icon("book", 16) + '問題集の解説</p><p class="expl-text">' + esc(q.explanation) + "</p></div>" +
            "</div>" +
            aiPanelHtml(q.id, !isCorrect, "quiz-" + session.mode + "-" + quiz.index) +
            '<button type="button" class="next-btn font-round" data-action="next">' + (quiz.index + 1 >= total ? "結果を見る" : "次の問題へ") + "</button>" +
            "</div>";
        }
        h += "</section></div>";
        return h;
      }

      function resultHtml() {
        var s = summary;
        var total = s.results.length;
        var correct = s.results.filter(function (r) { return r.correct; }).length;
        var rate = total > 0 ? Math.round(correct / total * 100) : 0;
        var wrongIds = s.results.filter(function (r) { return !r.correct; }).map(function (r) { return r.questionId; });
        var isExam = s.session.mode === "exam";
        var examPassed = isExam && correct >= EXAM_PASS_LINE;
        var lp = levelProgress(state.xp);
        var newDefs = BADGES.filter(function (b) { return s.newBadges.indexOf(b.id) !== -1; });
        var h = '<div class="result-wrap animate-rise"><p class="result-kicker font-round">' + esc(s.session.title) + " ・ 結果</p>";
        if (isExam) {
          h += '<div class="animate-pop"><p class="result-big font-round ' + (examPassed ? "ok" : "ng") + '">' + (examPassed ? "合格！" : "不合格") + '</p>' +
            '<p class="result-sub">合格ラインは ' + EXAM_QUESTIONS + "問中 " + EXAM_PASS_LINE + "問以上" + (!examPassed ? "（あと " + (EXAM_PASS_LINE - correct) + "問で合格ライン）" : "") + "</p></div>";
        } else {
          h += '<p class="result-big font-round animate-pop">' + (rate >= 80 ? "すばらしい！" : rate >= 50 ? "よくがんばった！" : "おつかれさま！") + "</p>";
        }
        if (s.leveledUp) {
          h += '<div class="levelup-box animate-pop"><span class="levelup-ic">' + icon("sparkles", 24) + '</span><div><p class="font-round" style="font-size:18px;font-weight:800">レベルアップ！ Lv.' + lp.level + ' になりました</p><p style="font-size:14px;color:var(--dim)">次のレベルまで あと ' + lp.toNext + " XP</p></div></div>";
        }
        if (newDefs.length > 0) {
          h += '<div class="newbadges"><p class="font-round" style="font-weight:800">新しいバッジを獲得！</p>' + newDefs.map(function (b) {
            return '<p class="nb-row"><span class="nb-ic" style="background:' + b.color + '">' + icon(b.icon, 18) + '</span><span class="font-round" style="font-weight:700">' + esc(b.name) + "</span></p>";
          }).join("") + "</div>";
        }
        h += '<section class="card result-stats"><div class="result-grid">' +
          '<div class="result-cell"><div class="v font-round">' + correct + ' <small>/ ' + total + '問</small></div><div class="l">正解数</div></div>' +
          '<div class="result-cell"><div class="v font-round">' + rate + '%</div><div class="l">正解率</div></div>' +
          '<div class="result-cell"><div class="v font-round" style="color:var(--accent)">+' + s.xpEarned + ' XP</div><div class="l">獲得XP</div></div>' +
          '<div class="result-cell"><div class="v font-round" style="display:flex;align-items:center;justify-content:center;gap:.25rem"><span style="color:var(--bad)">' + icon("flame", 20) + "</span>" + s.bestStreak + '</div><div class="l">連続正解記録</div></div>' +
          "</div>" +
          '<div style="margin-top:1rem"><div style="display:flex;align-items:center;justify-content:space-between;font-size:14px"><span class="font-round" style="font-weight:700">Lv.' + lp.level + '</span><span style="color:var(--dim)">' + state.xp + " XP ・ 次まで あと " + lp.toNext + ' XP</span></div>' +
          '<div class="bar-track" style="margin-top:.375rem;height:14px"><div class="bar-fill" style="width:' + Math.min(100, lp.intoLevel / lp.span * 100) + '%"></div></div></div>' +
          "</section>";
        var retryEmpty = false;
        if (s.session.unattemptedOnly) {
          if (s.session.mode === "category" && s.session.categoryName) {
            var rcat = null;
            CATEGORIES.forEach(function (c) { if (c.name === s.session.categoryName) rcat = c; });
            retryEmpty = !rcat || unattemptedCount(rcat.questionIds) === 0;
          } else {
            retryEmpty = unattemptedQuestions().length === 0;
          }
        }
        if (saveStatus === "failed") h += saveStatusHtml();
        h += '<div class="result-actions">';
        if (wrongIds.length > 0) {
          h += '<button type="button" class="btn-review font-round" data-action="review-wrongs" data-arg="' + wrongIds.join(",") + '">' + icon("refresh", 20) + "間違えた" + wrongIds.length + "問を復習する</button>";
        }
        h += '<button type="button" class="btn-retry font-round" data-action="retry"' + (retryEmpty ? " disabled" : "") + ">" + (retryEmpty ? "未挑戦の問題はありません（全問挑戦済みです）" : "もう一度このモードに挑戦") + "</button>" +
          '<button type="button" class="btn-home font-round" data-action="home">' + icon("home", 19) + "ホームに戻る</button></div></div>";
        return h;
      }

      function wrongListHtml() {
        var items = wrongList();
        var h = '<div class="animate-rise"><div class="wrong-head">' +
          '<button type="button" class="back-btn" data-action="home" aria-label="ホームに戻る">' + icon("back", 18) + '戻る</button>' +
          '<h2 class="font-round">間違えた問題 ' + items.length + "問</h2></div>";
        if (items.length === 0) {
          h += '<div class="empty-box"><p class="t font-round">間違えた問題はまだありません</p>' +
            '<p class="d">問題に挑戦して間違えると、ここに自動で記録されます。復習モードで正解すると「卒業」して、この一覧から外れます。</p></div>';
        } else {
          h += '<button type="button" class="btn-review font-round" style="margin-top:1rem" data-action="start" data-arg="review">' + icon("refresh", 20) + "この" + items.length + "問を復習する</button>" +
            '<div class="stack" style="margin-top:1rem">' + items.map(function (w) {
              var q = QBYID[w.questionId];
              var open = wrongOpenId === q.id;
              var detail = "";
              if (open) {
                detail = '<div class="wrong-detail animate-rise"><div class="answer-box">' +
                  '<p class="answer-line">' + icon("check", 16) + "正解は「" + esc(q.choices[q.answer]) + "」</p>" +
                  '<div class="expl-block"><p class="expl-label">' + icon("book", 16) + '問題集の解説</p><p class="expl-text">' + esc(q.explanation) + "</p></div></div>" +
                  aiPanelHtml(q.id, true, "wrong") +
                  "</div>";
              }
              return '<article class="wrong-item card"><div class="wrong-meta">' +
                '<span class="q-cat" style="background:' + catColor(q.category) + '">' + esc(q.category) + "</span>" +
                '<span class="q-num">問題 ' + q.id + "</span>" +
                '<span class="wc">' + w.wrongCount + "回間違えた</span>" +
                (w.lastWrongAt ? '<span class="date">最後：' + esc(formatDate(w.lastWrongAt)) + "</span>" : "") +
                "</div>" +
                '<p class="wrong-q">' + esc(q.question) + "</p>" +
                '<button type="button" class="toggle-btn font-round" data-action="toggle-wrong" data-arg="' + q.id + '" aria-expanded="' + open + '">' + (open ? "解説を閉じる" : "正解と解説を見る") + '<span class="chev' + (open ? " open" : "") + '">' + icon("chevronDown", 17) + "</span></button>" +
                detail + "</article>";
            }).join("") + "</div>";
        }
        return h + "</div>";
      }

      function render() {
        if (view === "quiz" && session && quiz) app.innerHTML = quizHtml();
        else if (view === "result" && summary) app.innerHTML = resultHtml();
        else if (view === "wrongList") app.innerHTML = wrongListHtml();
        else app.innerHTML = homeHtml();
      }

      // ---------- Events ----------
      document.addEventListener("click", function (ev) {
        var el = ev.target.closest("[data-action]");
        if (!el) return;
        var action = el.getAttribute("data-action");
        var arg = el.getAttribute("data-arg");
        if (action === "start") {
          if (arg === "random10") startSession(buildSession("random10", null, { unattemptedOnly: randomUnattemptedOnly }));
          else startSession(buildSession(arg));
        } else if (action === "start-category") {
          startSession(buildSession("category", arg, { unattemptedOnly: catUnattemptedOnly }));
        } else if (action === "toggle-cat-unattempted") {
          catUnattemptedOnly = !catUnattemptedOnly; render();
        } else if (action === "toggle-random-unattempted") {
          randomUnattemptedOnly = !randomUnattemptedOnly; render();
        } else if (action === "open-wrong") {
          view = "wrongList"; wrongOpenId = null; render(); window.scrollTo(0, 0);
        } else if (action === "home") {
          view = "home"; session = null; quiz = null; summary = null; resetConfirming = false; render(); window.scrollTo(0, 0);
        } else if (action === "pick") {
          if (!session || !quiz || quiz.picked !== null) return;
          var q = session.questions[quiz.index];
          var picked = Number(arg);
          var wasOnList = !!(state.stats[q.id] && state.stats[q.id].onWrongList);
          var correct = picked === q.answer;
          quiz.picked = picked;
          var xp = applyAnswer(q, correct);
          quiz.results.push({ questionId: q.id, correct: correct, xp: xp, graduating: correct && session.mode === "review" && wasOnList });
          if (correct) quiz.burst += 1;
          render();
        } else if (action === "next") {
          if (!session || !quiz) return;
          if (quiz.index + 1 >= session.questions.length) finishSession();
          else { quiz.index += 1; quiz.picked = null; render(); window.scrollTo(0, 0); }
        } else if (action === "quit") {
          if (!session || !quiz) { view = "home"; render(); return; }
          if (quiz.results.length === 0) { session = null; quiz = null; view = "home"; render(); window.scrollTo(0, 0); }
          else finishSession();
        } else if (action === "review-wrongs") {
          var ids = arg.split(",").map(Number).filter(function (id) { return QBYID[id]; });
          if (ids.length) startSession({ mode: "review", title: MODE_LABELS.review, questions: ids.map(function (id) { return QBYID[id]; }) });
        } else if (action === "retry") {
          if (summary) startSession(buildSession(summary.session.mode, summary.session.categoryName, { unattemptedOnly: !!summary.session.unattemptedOnly }));
        } else if (action === "toggle-wrong") {
          var id = Number(arg);
          wrongOpenId = wrongOpenId === id ? null : id;
          render();
        } else if (action === "toggle-ai") {
          var key = el.getAttribute("data-key");
          var panel = el.closest(".ai-panel");
          var qid = Number(key.split(":").pop());
          var prefix = key.slice(0, key.length - String(qid).length - 1);
          // Determine current open state from DOM
          var isOpen = el.getAttribute("aria-expanded") === "true";
          aiOpenState[key] = !isOpen;
          render();
        } else if (action === "reset-ask") {
          resetConfirming = true; render();
        } else if (action === "reset-cancel") {
          resetConfirming = false; render();
        } else if (action === "export-file") {
          try {
            var blob = new Blob([exportPayload()], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "gakushu-kiroku-backup.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
            backupUi.msg = "記録ファイルを書き出しました。なくさないよう保管してください。";
            backupUi.msgOk = true;
          } catch (e) {
            backupUi.showCode = true;
            backupUi.msg = "ファイルへの書き出しができませんでした。下の「コードで書き出す」から記録コードをコピーして保管してください。";
            backupUi.msgOk = false;
          }
          render();
        } else if (action === "export-code") {
          backupUi.showCode = !backupUi.showCode;
          render();
        } else if (action === "copy-code") {
          var codeTa = document.getElementById("export-code");
          var codeText = codeTa ? codeTa.value : exportPayload();
          var copyDone = function (ok) {
            backupUi.msg = ok ? "記録コードをコピーしました。メモアプリなどに貼って保管してください。" : "コピーできませんでした。コード全体を選択してコピーしてください。";
            backupUi.msgOk = ok;
            render();
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(codeText).then(function () { copyDone(true); }, function () {
              if (codeTa) { codeTa.focus(); codeTa.select(); }
              copyDone(false);
            });
          } else {
            if (codeTa) { codeTa.focus(); codeTa.select(); }
            copyDone(false);
          }
        } else if (action === "import-text") {
          var importTa = document.getElementById("import-code");
          var importText = importTa ? importTa.value.trim() : "";
          if (!importText) {
            backupUi.pending = null;
            backupUi.msg = "コードが入力されていません。書き出した記録コードを貼り付けてから押してください。";
            backupUi.msgOk = false;
            render();
          } else {
            tryImport(importText);
          }
        } else if (action === "import-confirm") {
          if (backupUi.pending) applyImport(backupUi.pending);
          render();
        } else if (action === "import-cancel") {
          backupUi.pending = null;
          backupUi.msg = "読み込みをキャンセルしました。今の記録はそのままです。";
          backupUi.msgOk = true;
          render();
        } else if (action === "reset-do") {
          state = emptyState();
          try { window.localStorage.removeItem(STORAGE_KEY); window.localStorage.removeItem(STORAGE_BACKUP_KEY); } catch (e) {}
          deleteCookie();
          lsSaveOk = null; cookieSaveOk = null;
          storageOK = probeStorage();
          saveStatus = storageOK ? "ok" : "failed";
          lastSavedAt = null;
          backupUi = { showCode: false, msg: "", msgOk: true, pending: null };
          saveState();
          resetConfirming = false;
          aiOpenState = {};
          render();
          window.scrollTo(0, 0);
        }
      });
      document.addEventListener("change", function (ev) {
        if (!ev.target || ev.target.id !== "import-file") return;
        var f = ev.target.files && ev.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { tryImport(String(reader.result || "")); };
        reader.onerror = function () {
          backupUi.pending = null;
          backupUi.msg = "ファイルを読み込めませんでした。書き出した記録ファイルかどうか確認してください。";
          backupUi.msgOk = false;
          render();
        };
        reader.readAsText(f);
      });

      render();
    </script>
  </body>
</html>
